name: refresh merged PRs

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-merged-prs

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the merged-PR block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/render_merged_prs.py

      - name: Compare the profile pins with the merged list
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_pins.py --output pin-plan.txt

      - name: Commit if the data changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh merged PR list [skip ci]"
          git push

      # Pins have no API, so the run only leaves the order to apply by hand.
      - name: Upload the pin plan
        if: hashFiles('pin-plan.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pin-plan
          path: pin-plan.txt
          retention-days: 14
